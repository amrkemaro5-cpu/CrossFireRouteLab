name: Build StageBug Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ stagebug-reconstruction ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build StageBug/StageBug.csproj -c Release -warnaserror
      - name: Publish
        run: dotnet publish StageBug/StageBug.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o publish/StageBug
      - name: Upload StageBug
        uses: actions/upload-artifact@v4
        with:
          name: StageBug-Windows-x64
          path: publish/StageBug
          if-no-files-found: error
