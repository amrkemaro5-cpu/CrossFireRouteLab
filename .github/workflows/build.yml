name: Build Windows x64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Patch WinForms transparent-control startup bug
        shell: pwsh
        run: |
          $path = 'DashboardForm.cs'
          $text = Get-Content $path -Raw
          $old = 'public AnimatedRadar() { DoubleBuffered = true; BackColor = Color.Transparent; }'
          $new = 'public AnimatedRadar() { SetStyle(ControlStyles.UserPaint -bor ControlStyles.AllPaintingInWmPaint -bor ControlStyles.OptimizedDoubleBuffer, true); DoubleBuffered = true; BackColor = Color.FromArgb(5, 10, 21); }'
          if (-not $text.Contains($old)) { throw 'Expected AnimatedRadar constructor was not found; refusing to build an unverified UI.' }
          $text = $text.Replace($old, $new)
          Set-Content -Path $path -Value $text -Encoding UTF8
          if ((Get-Content $path -Raw).Contains('public AnimatedRadar() { DoubleBuffered = true; BackColor = Color.Transparent; }')) { throw 'Transparent AnimatedRadar constructor is still present.' }

      - name: Create GRL application icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python build_icon.py

      - name: Restore
        run: dotnet restore CrossFireRouteLab.csproj

      - name: Build
        run: dotnet build CrossFireRouteLab.csproj -c Release --no-restore

      - name: Startup UI smoke test
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP 'grl-startup-smoke'
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <UseWindowsForms>true</UseWindowsForms>
              <EnableWindowsTargeting>true</EnableWindowsTargeting>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="__ROOT__\CrossFireRouteLab.csproj" />
            </ItemGroup>
          </Project>
          '@.Replace('__ROOT__', $env:GITHUB_WORKSPACE) | Set-Content (Join-Path $testDir 'Smoke.csproj') -Encoding UTF8
          @'
          using CrossFireRouteLab;
          using System.Windows.Forms;

          [STAThread]
          static class Smoke
          {
              static void Main()
              {
                  ApplicationConfiguration.Initialize();
                  using var form = new DashboardForm();
                  form.CreateControl();
                  form.PerformLayout();
                  Console.WriteLine($"SMOKE OK: {form.ClientSize.Width}x{form.ClientSize.Height}");
              }
          }
          '@ | Set-Content (Join-Path $testDir 'Program.cs') -Encoding UTF8
          dotnet run --project (Join-Path $testDir 'Smoke.csproj') -c Release

      - name: Persist verified source fix
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DashboardForm.cs
          if (git diff --cached --quiet) {
            Write-Host 'No source patch needed.'
          } else {
            git commit -m 'Fix startup crash from transparent custom control [skip ci]'
            git push origin HEAD:main
          }

      - name: Publish reliable Windows x64 folder
        run: dotnet publish CrossFireRouteLab.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -o publish

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item publish\* package\ -Recurse -Force
          Copy-Item README.md package\README.md -Force
          Copy-Item USER_GUIDE.md package\USER_GUIDE.md -Force
          Copy-Item assets\GameRouteLab.ico package\GameRouteLab.ico -Force
          if (-not (Test-Path package\GameRouteLab.exe)) { throw 'GameRouteLab.exe was not produced.' }
          if (-not (Test-Path package\GameRouteLab.runtimeconfig.json)) { throw 'Runtime config was not produced.' }
          if (-not (Test-Path package\GameRouteLab.deps.json)) { throw 'Dependency manifest was not produced.' }
          Get-ChildItem package | Select-Object Name,Length | Format-Table -AutoSize

      - name: Smoke-check published application files
        shell: pwsh
        run: |
          $exe = Get-Item package\GameRouteLab.exe
          if ($exe.Length -lt 100KB) { throw 'Published executable is unexpectedly small.' }
          $runtime = Get-Content package\GameRouteLab.runtimeconfig.json -Raw | ConvertFrom-Json
          if (-not $runtime.runtimeOptions.tfm) { throw 'Runtime config is missing a target framework.' }
          Write-Host "Executable: $($exe.Length) bytes"
          Write-Host "Target framework: $($runtime.runtimeOptions.tfm)"
          Write-Host "Publish mode: self-contained folder"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: GameRouteLab-Windows-x64
          path: package
          if-no-files-found: error
          compression-level: 6
