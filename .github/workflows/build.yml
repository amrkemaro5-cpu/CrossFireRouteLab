name: Build Windows x64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CrossFireRouteLab.csproj

      - name: Build
        run: dotnet build CrossFireRouteLab.csproj -c Release --no-restore

      - name: Publish self-contained Windows x64
        run: dotnet publish CrossFireRouteLab.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o publish

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item publish\GameRouteLab.exe package\GameRouteLab.exe
          Copy-Item README.md package\README.md

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: GameRouteLab-Windows-x64
          path: package
          if-no-files-found: error
          compression-level: 6
