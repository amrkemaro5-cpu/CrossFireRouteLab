name: Build Windows x64

on:
  push:
    branches: [ main, tcp-existing-rtt-validation ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CrossFireRouteLab.csproj

      - name: Normalize known V10 source compatibility issues
        shell: pwsh
        run: |
          $path = 'GameRouteLabV10Form.cs'
          $src = Get-Content $path -Raw
          $src = $src.Replace('static readonly Color Text =', 'new static readonly Color Text =')
          $src = $src.Replace('Text = "Game Route Lab v10";', 'base.Text = "Game Route Lab v10";')
          $src = $src.Replace('public RadarPanel() { DoubleBuffered = true; BackColor = Color.Transparent; }', 'public RadarPanel() { DoubleBuffered = true; BackColor = Color.FromArgb(3, 7, 17); }')
          Set-Content $path $src -Encoding UTF8
          Write-Host 'V10 source compatibility normalization applied.'

      - name: Verify simple CrossFire TCP architecture
        shell: pwsh
        run: |
          if (-not (Test-Path 'CrossFireTcpSimple.cs')) { throw 'Simple CrossFire TCP reader is missing.' }
          if (Test-Path 'CrossFireRouteEngine.cs') { throw 'Obsolete complex CrossFire route engine still exists.' }

          $tcp = Get-Content 'CrossFireTcpSimple.cs' -Raw
          $program = Get-Content 'Program.cs' -Raw

          foreach ($required in @('GetExtendedTcpTable','GetPerTcpConnectionEStats','SetPerTcpConnectionEStats','TcpConnectionEstatsFineRtt','ReadEstablishedTcpSockets','MeasureExistingTcpRtt')) {
            if (-not $tcp.Contains($required)) { throw "Simple TCP implementation is missing: $required" }
          }

          foreach ($forbidden in @('ControlPorts','NoisePorts','history','SeenCount','PktMon','UdpClient','SendPing','System.Net.Ping','PING       NOT CLAIMED','CONTROL FALLBACK','seen:')) {
            if ($tcp.Contains($forbidden)) { throw "Old/complex TCP design leaked into the new reader: $forbidden" }
          }

          $measurementSection = $tcp.Substring($tcp.IndexOf('MeasureExistingTcpRtt', [StringComparison]::Ordinal))
          $measurementSection = $measurementSection.Substring(0, $measurementSection.IndexOf('private static void Publish', [StringComparison]::Ordinal))
          if ($measurementSection.Contains('ConnectAsync')) { throw 'Existing-socket RTT reader must not open a new TCP connection.' }

          if (-not $program.Contains('CrossFireTcpSimple.Apply')) { throw 'Program.cs is not using the simple CrossFire TCP reader.' }
          if ($program.Contains('CrossFireRouteEngine.Apply')) { throw 'Program.cs still references the obsolete CrossFire route engine.' }

          Write-Host 'Simple existing-socket TCP architecture verification passed.'

      - name: Build with warnings treated as errors
        run: dotnet build CrossFireRouteLab.csproj -c Release -warnaserror

      - name: Startup and layout smoke test
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP 'grl-startup-smoke'
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <UseWindowsForms>true</UseWindowsForms>
              <EnableWindowsTargeting>true</EnableWindowsTargeting>
            </PropertyGroup>
            <ItemGroup><ProjectReference Include="__ROOT__\CrossFireRouteLab.csproj" /></ItemGroup>
          </Project>
          '@.Replace('__ROOT__', $env:GITHUB_WORKSPACE) | Set-Content (Join-Path $testDir 'Smoke.csproj') -Encoding UTF8
          @'
          using System;
          using System.Linq;
          using System.Collections.Generic;
          using CrossFireRouteLab;
          using System.Windows.Forms;
          static class Smoke {
            static IEnumerable<Control> All(Control root) { foreach (Control c in root.Controls) { yield return c; foreach (var x in All(c)) yield return x; } }
            [STAThread] static void Main() {
              ApplicationConfiguration.Initialize();
              using var form = new GameRouteLabV10Form();
              form.CreateControl(); form.PerformLayout(); form.Show(); Application.DoEvents();
              if (form.ClientSize.Width < 900 || form.ClientSize.Height < 650) throw new Exception($"Unexpected form size: {form.ClientSize}");
              var controls = All(form).ToList();
              if (!controls.OfType<Label>().Any(x => x.Text == "GAME ROUTE LAB")) throw new Exception("GRL title missing.");
              if (!controls.OfType<Label>().Any(x => x.Text == "GAME MEMORY")) throw new Exception("Game Memory missing.");
              if (!controls.OfType<Label>().Any(x => x.Text == "LIVE ANALYSIS CONSOLE")) throw new Exception("Console missing.");
              if (!controls.OfType<Button>().Any(x => x.Text == "AUTO ANALYZE")) throw new Exception("Auto Analyze missing.");
              if (controls.Count(x => x is Button b && b.Text == "ADD GAME EXE") != 1) throw new Exception("Add Game EXE must appear exactly once.");
              Console.WriteLine($"V10 SMOKE OK: {form.ClientSize.Width}x{form.ClientSize.Height}; controls={controls.Count}");
              form.Close();
            }
          }
          '@ | Set-Content (Join-Path $testDir 'Program.cs') -Encoding UTF8
          dotnet run --project (Join-Path $testDir 'Smoke.csproj') -c Release

      - name: Check known CrossFire TCP endpoint from Windows runner
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host 'This is only an external reachability check from the GitHub runner, not a room-ping claim.'
          Test-NetConnection 67.210.208.54 -Port 10009 -InformationLevel Detailed

      - name: Publish Windows x64
        run: dotnet publish CrossFireRouteLab.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -o publish

      - name: Prepare clean package
        shell: pwsh
        run: |
          Remove-Item package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item publish\* package\ -Recurse -Force
          Copy-Item README.md package\README.md -Force
          if (Test-Path USER_GUIDE.md) { Copy-Item USER_GUIDE.md package\USER_GUIDE.md -Force }
          Copy-Item assets\GameRouteLab.ico package\GameRouteLab.ico -Force
          if (-not (Test-Path package\GameRouteLab.exe)) { throw 'GameRouteLab.exe was not produced.' }
          $exe = Get-Item package\GameRouteLab.exe
          if ($exe.Length -lt 100KB) { throw 'Published executable is unexpectedly small.' }
          Write-Host "Clean package ready: $($exe.Length) bytes"

      - name: Verify standard ZIP extraction
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'GameRouteLab-v10-test.zip'
          $out = Join-Path $env:RUNNER_TEMP 'GameRouteLab-v10-test-extracted'
          Compress-Archive -Path package\* -DestinationPath $zip -Force
          Expand-Archive -Path $zip -DestinationPath $out -Force
          if (-not (Test-Path $out\GameRouteLab.exe)) { throw 'ZIP verification failed.' }
          Write-Host 'ZIP verification passed.'

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: GameRouteLab-v10-Windows-x64
          path: package
          if-no-files-found: error
          compression-level: 6
