name: Build Windows x64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CrossFireRouteLab.csproj

      - name: Normalize v10 source before compile
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'GameRouteLabV10Form.cs'
          $src = Get-Content $path -Raw
          $src = $src.Replace('static readonly Color Text =', 'new static readonly Color Text =')
          $src = $src.Replace('Text = "Game Route Lab v10";', 'base.Text = "Game Route Lab v10";')
          $src = $src.Replace('Text="Game Route Lab v10";', 'base.Text="Game Route Lab v10";')
          $src = $src.Replace('Text="Game Route Lab v9";', 'base.Text="Game Route Lab v10";')
          $src = $src.Replace('public RadarPanel() { DoubleBuffered = true; BackColor = Color.Transparent; }', 'public RadarPanel() { DoubleBuffered = true; BackColor = Color.FromArgb(3, 7, 17); }')
          $src = $src.Replace('ColumnCount=11', 'ColumnCount=10')
          $src = $src.Replace('for(int i=1;i<11;i++)t.ColumnStyles.Add', 'for(int i=1;i<10;i++)t.ColumnStyles.Add')
          $src = $src.Replace('"AUTO ANALYZE","REFRESH GAMES","ADD GAME EXE","DETECT NETWORK"', '"AUTO ANALYZE","REFRESH GAMES","DETECT NETWORK"')
          $src = $src.Replace('c={PURPLE,CYAN,BLUE,CYAN,PURPLE,CYAN,GREEN,PURPLE,GREEN,BLUE}', 'c={PURPLE,CYAN,CYAN,PURPLE,CYAN,GREEN,PURPLE,GREEN,BLUE}')
          Set-Content $path $src -Encoding UTF8
          Write-Host 'v10 compile, focus-safe and toolbar normalization applied.'

      - name: Fix CrossFire room endpoint selection before compile
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'CrossFireRoomTransportProbeV3.cs'
          $src = Get-Content $path -Raw

          $old = 'var tcpRoom = room.FirstOrDefault(x => x.Protocol == "TCP"); var best = tcpRoom.RemoteIp != null ? tcpRoom : room.FirstOrDefault();'
          $new = 'var best = room.OrderByDescending(Score).FirstOrDefault();'
          if (-not $src.Contains($old)) { throw 'Expected V3 TCP-first selection bug was not found; refusing to build an unpatched package.' }
          $src = $src.Replace($old, $new)

          # Port 10009 is not automatically CONTROL anymore. If a normally-control
          # port carries sustained bidirectional traffic, treat it as a real room
          # candidate. Tiny 10009 flows remain control and cannot hijack selection.
          $oldRoom = 'var room = candidates.Where(x => !ControlPorts.Contains(x.RemotePort)).ToList();'
          $newRoom = 'var room = candidates.Where(x => !IsControlFlow(x)).ToList();'
          if (-not $src.Contains($oldRoom)) { throw 'Expected room-filter expression was not found.' }
          $src = $src.Replace($oldRoom, $newRoom)

          $oldScore = 'if (f.Protocol == "UDP") score += 35; if (f.Protocol == "TCP") score += 20; if (f.RemotePort is >= 12000 and <= 14000) score += 100; else if (f.RemotePort is >= 11000 and <= 16000) score += 55; if (ControlPorts.Contains(f.RemotePort)) score -= 160;'
          $newScore = 'if (f.Protocol == "UDP") score += 20; if (f.Protocol == "TCP") score += 20; if (f.RemotePort is >= 12000 and <= 14000) score += 100; else if (f.RemotePort is >= 11000 and <= 16000) score += 55; if (IsControlFlow(f)) score -= 160;'
          if (-not $src.Contains($oldScore)) { throw 'Expected transport score expression was not found.' }
          $src = $src.Replace($oldScore, $newScore)

          $oldLabel = 'ControlPorts.Contains(c.RemotePort) ? "CONTROL" : "ROOM"'
          $newLabel = 'IsControlFlow(c) ? "CONTROL" : "ROOM"'
          if (-not $src.Contains($oldLabel)) { throw 'Expected endpoint label expression was not found.' }
          $src = $src.Replace($oldLabel, $newLabel)

          $marker = '    static void Publish(GameRouteLabV10Form form, List<Flow> candidates, (double RttMs, int Samples, string Method) roomRtt)'
          $method = @'
    static bool IsControlFlow(Flow f)
    {
        if (!ControlPorts.Contains(f.RemotePort)) return false;
        if (f.Protocol.Equals("TCP", StringComparison.OrdinalIgnoreCase) && f.In > 0 && f.Out > 0 && (f.In + f.Out) >= 20) return false;
        return true;
    }

'@
          if (-not $src.Contains($marker)) { throw 'Publish marker not found; refusing to build.' }
          $src = $src.Replace($marker, $method + $marker)

          Set-Content $path $src -Encoding UTF8
          Write-Host 'Final room decision fixed: sustained bidirectional TCP/10009 can be a room endpoint; small control flows remain excluded; UDP no longer receives an arbitrary protocol bonus.'

      - name: Verify CrossFire room selection patch
        shell: pwsh
        run: |
          $src = Get-Content CrossFireRoomTransportProbeV3.cs -Raw
          if ($src.Contains('var tcpRoom = room.FirstOrDefault(x => x.Protocol == "TCP");')) { throw 'TCP-first room selection still present.' }
          if (-not $src.Contains('var best = room.OrderByDescending(Score).FirstOrDefault();')) { throw 'Room-score selection patch missing.' }
          if (-not $src.Contains('static bool IsControlFlow(Flow f)')) { throw 'Dynamic control-flow classifier missing.' }
          if (-not $src.Contains('var room = candidates.Where(x => !IsControlFlow(x)).ToList();')) { throw 'Dynamic room filter missing.' }
          if (-not $src.Contains('if (f.Protocol == "UDP") score += 20; if (f.Protocol == "TCP") score += 20;')) { throw 'Protocol-neutral scoring missing.' }
          Write-Host 'CrossFire final room selection verification passed.'

      - name: Build with warnings treated as errors
        run: dotnet build CrossFireRouteLab.csproj -c Release --no-restore -warnaserror

      - name: Startup and layout smoke test
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP 'grl-startup-smoke'
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <UseWindowsForms>true</UseWindowsForms>
              <EnableWindowsTargeting>true</EnableWindowsTargeting>
            </PropertyGroup>
            <ItemGroup><ProjectReference Include="__ROOT__\CrossFireRouteLab.csproj" /></ItemGroup>
          </Project>
          '@.Replace('__ROOT__', $env:GITHUB_WORKSPACE) | Set-Content (Join-Path $testDir 'Smoke.csproj') -Encoding UTF8
          @'
          using System;
          using System.Linq;
          using System.Collections.Generic;
          using CrossFireRouteLab;
          using System.Windows.Forms;
          static class Smoke {
            static IEnumerable<Control> All(Control root) { foreach (Control c in root.Controls) { yield return c; foreach (var x in All(c)) yield return x; } }
            [STAThread] static void Main() {
              ApplicationConfiguration.Initialize();
              using var form = new GameRouteLabV10Form();
              form.CreateControl(); form.PerformLayout(); form.Show(); Application.DoEvents();
              if (form.ClientSize.Width < 900 || form.ClientSize.Height < 650) throw new Exception($"Unexpected form size: {form.ClientSize}");
              var controls = All(form).ToList();
              if (!controls.OfType<Label>().Any(x => x.Text == "GAME ROUTE LAB")) throw new Exception("GRL title missing.");
              if (!controls.OfType<Label>().Any(x => x.Text == "GAME MEMORY")) throw new Exception("Game Memory missing.");
              if (!controls.OfType<Label>().Any(x => x.Text == "LIVE ANALYSIS CONSOLE")) throw new Exception("Console missing.");
              if (!controls.OfType<Button>().Any(x => x.Text == "AUTO ANALYZE")) throw new Exception("Auto Analyze missing.");
              if (controls.Count(x => x is Button b && b.Text == "ADD GAME EXE") != 1) throw new Exception("Add Game EXE must appear exactly once.");
              if (!controls.Any(x => x.GetType().Name.Contains("Telemetry", StringComparison.OrdinalIgnoreCase))) throw new Exception("Telemetry panel missing.");
              Console.WriteLine($"V10 SMOKE OK: {form.ClientSize.Width}x{form.ClientSize.Height}; controls={controls.Count}");
              form.Close();
            }
          }
          '@ | Set-Content (Join-Path $testDir 'Program.cs') -Encoding UTF8
          dotnet run --project (Join-Path $testDir 'Smoke.csproj') -c Release

      - name: Publish Windows x64
        run: dotnet publish CrossFireRouteLab.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -o publish

      - name: Prepare clean package
        shell: pwsh
        run: |
          Remove-Item package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item publish\* package\ -Recurse -Force
          Copy-Item README.md package\README.md -Force
          if (Test-Path USER_GUIDE.md) { Copy-Item USER_GUIDE.md package\USER_GUIDE.md -Force }
          Copy-Item assets\GameRouteLab.ico package\GameRouteLab.ico -Force
          if (-not (Test-Path package\GameRouteLab.exe)) { throw 'GameRouteLab.exe was not produced.' }
          if (-not (Test-Path package\GameRouteLab.runtimeconfig.json)) { throw 'Runtime config was not produced.' }
          if (-not (Test-Path package\GameRouteLab.deps.json)) { throw 'Dependency manifest was not produced.' }
          if (-not (Test-Path package\GameRouteLab.ico)) { throw 'GRL icon was not packaged.' }
          $exe = Get-Item package\GameRouteLab.exe
          if ($exe.Length -lt 100KB) { throw 'Published executable is unexpectedly small.' }
          Write-Host "Clean package ready: $($exe.Length) bytes"

      - name: Verify standard ZIP extraction
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'GameRouteLab-v10-test.zip'
          $out = Join-Path $env:RUNNER_TEMP 'GameRouteLab-v10-test-extracted'
          Compress-Archive -Path package\* -DestinationPath $zip -Force
          Expand-Archive -Path $zip -DestinationPath $out -Force
          if (-not (Test-Path $out\GameRouteLab.exe)) { throw 'ZIP verification failed.' }
          Write-Host 'ZIP verification passed: non-encrypted standard ZIP.'

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: GameRouteLab-v10-Windows-x64
          path: package
          if-no-files-found: error
          compression-level: 6
