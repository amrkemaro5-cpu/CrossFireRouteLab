name: Build Windows x64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply verified reference UI patch
        shell: pwsh
        run: .\polish_ui.ps1

      - name: Create GRL application icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python build_icon.py

      - name: Normalize v8 source before build
        shell: pwsh
        run: .\fix_v8_build.ps1

      - name: Restore
        run: dotnet restore CrossFireRouteLab.csproj

      - name: Build with warnings treated as errors
        run: dotnet build CrossFireRouteLab.csproj -c Release --no-restore -warnaserror

      - name: Startup and layout smoke test
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP 'grl-startup-smoke'
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <UseWindowsForms>true</UseWindowsForms>
              <EnableWindowsTargeting>true</EnableWindowsTargeting>
            </PropertyGroup>
            <ItemGroup><ProjectReference Include="__ROOT__\CrossFireRouteLab.csproj" /></ItemGroup>
          </Project>
          '@.Replace('__ROOT__', $env:GITHUB_WORKSPACE) | Set-Content (Join-Path $testDir 'Smoke.csproj') -Encoding UTF8
          @'
          using System;
          using System.Linq;
          using System.Collections.Generic;
          using CrossFireRouteLab;
          using System.Windows.Forms;
          static class Smoke {
            static IEnumerable<Control> All(Control root) { foreach (Control c in root.Controls) { yield return c; foreach (var x in All(c)) yield return x; } }
            [STAThread] static void Main() {
              ApplicationConfiguration.Initialize();
              using var form = new GameRouteLabV8Form();
              form.CreateControl(); form.PerformLayout(); form.Show(); Application.DoEvents();
              if (form.ClientSize.Width < 900 || form.ClientSize.Height < 650) throw new Exception($"Unexpected form size: {form.ClientSize}");
              var controls = All(form).ToList();
              if (!controls.OfType<Label>().Any(x => x.Text == "GAME ROUTE LAB")) throw new Exception("GRL title missing.");
              if (!controls.OfType<Label>().Any(x => x.Text == "GAME MEMORY")) throw new Exception("Game Memory missing.");
              if (!controls.OfType<Label>().Any(x => x.Text == "LIVE ANALYSIS CONSOLE")) throw new Exception("Console missing.");
              if (!controls.OfType<Button>().Any(x => x.Text.Contains("AUTO ANALYZE"))) throw new Exception("Auto Analyze missing.");
              if (controls.Any(c => c.Width <= 0 || c.Height <= 0)) throw new Exception("Invalid control dimensions.");
              Console.WriteLine($"V8 SMOKE OK: {form.ClientSize.Width}x{form.ClientSize.Height}; controls={controls.Count}");
              form.Close();
            }
          }
          '@ | Set-Content (Join-Path $testDir 'Program.cs') -Encoding UTF8
          dotnet run --project (Join-Path $testDir 'Smoke.csproj') -c Release

      - name: Persist verified source patch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GameRouteLabV8Form.cs
          if (git diff --cached --quiet) { Write-Host 'No v8 source changes.' } else { git commit -m 'Persist v8 compile fixes [skip ci]'; git push origin HEAD:main }

      - name: Publish reliable Windows x64 folder
        run: dotnet publish CrossFireRouteLab.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -o publish

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item publish\* package\ -Recurse -Force
          Copy-Item README.md package\README.md -Force
          Copy-Item USER_GUIDE.md package\USER_GUIDE.md -Force
          Copy-Item assets\GameRouteLab.ico package\GameRouteLab.ico -Force
          if (-not (Test-Path package\GameRouteLab.exe)) { throw 'GameRouteLab.exe was not produced.' }
          if (-not (Test-Path package\GameRouteLab.runtimeconfig.json)) { throw 'Runtime config was not produced.' }
          if (-not (Test-Path package\GameRouteLab.deps.json)) { throw 'Dependency manifest was not produced.' }
          if (-not (Test-Path package\GameRouteLab.ico)) { throw 'GRL icon was not packaged.' }
          Get-ChildItem package | Select-Object Name,Length | Format-Table -AutoSize

      - name: Smoke-check published application files
        shell: pwsh
        run: |
          $exe = Get-Item package\GameRouteLab.exe
          if ($exe.Length -lt 100KB) { throw 'Published executable is unexpectedly small.' }
          $runtime = Get-Content package\GameRouteLab.runtimeconfig.json -Raw | ConvertFrom-Json
          if (-not $runtime.runtimeOptions.tfm) { throw 'Runtime config is missing a target framework.' }
          Write-Host "Executable: $($exe.Length) bytes"
          Write-Host "Target framework: $($runtime.runtimeOptions.tfm)"
          Write-Host "Publish mode: self-contained folder"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: GameRouteLab-Windows-x64
          path: package
          if-no-files-found: error
          compression-level: 6
