name: Game Route Lab v8

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v8:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Normalize v8 source before build
        shell: pwsh
        run: .\fix_v8_build.ps1

      - name: Restore
        run: dotnet restore CrossFireRouteLab.csproj

      - name: Build v8
        run: dotnet build CrossFireRouteLab.csproj -c Release --no-restore -warnaserror

      - name: Publish Windows x64 self-contained
        run: dotnet publish CrossFireRouteLab.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -o publish-v8

      - name: Prepare clean v8 package folder
        shell: pwsh
        run: |
          Remove-Item package-v8 -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path package-v8 | Out-Null
          Copy-Item publish-v8\* package-v8\ -Recurse -Force
          Copy-Item README.md package-v8\README.md -Force
          if (Test-Path USER_GUIDE.md) { Copy-Item USER_GUIDE.md package-v8\USER_GUIDE.md -Force }

          $exe = Get-Item package-v8\GameRouteLab.exe
          if ($exe.Length -lt 100KB) { throw 'GameRouteLab.exe is unexpectedly small.' }
          if (-not (Test-Path package-v8\GameRouteLab.runtimeconfig.json)) { throw 'Runtime config is missing.' }
          if (-not (Test-Path package-v8\GameRouteLab.deps.json)) { throw 'Dependency manifest is missing.' }
          Write-Host "Clean package ready: $($exe.Length) bytes"

      - name: Verify ZIP packaging is not encrypted
        shell: pwsh
        run: |
          $testZip = Join-Path $env:RUNNER_TEMP 'GameRouteLab-v8-package-test.zip'
          $testExtract = Join-Path $env:RUNNER_TEMP 'GameRouteLab-v8-package-test-extracted'
          Remove-Item $testZip -Force -ErrorAction SilentlyContinue
          Remove-Item $testExtract -Recurse -Force -ErrorAction SilentlyContinue

          Compress-Archive -Path package-v8\* -DestinationPath $testZip -Force
          Expand-Archive -Path $testZip -DestinationPath $testExtract -Force

          if (-not (Test-Path $testExtract\GameRouteLab.exe)) {
            throw 'ZIP verification failed: executable could not be extracted.'
          }
          Write-Host 'ZIP verification passed: standard non-encrypted ZIP extraction succeeded.'

      - name: Upload clean v8 package
        uses: actions/upload-artifact@v4
        with:
          name: GameRouteLab-v8-Windows-x64-CLEAN
          path: package-v8
          if-no-files-found: error
          compression-level: 6
